<!doctype html>
<!-- The link preview of Lawn Figures (WhatsApp, social): 1200x630, rendered to
     apps/lawn/public/og.png by tooling/site-browser/og/render-lawn.mjs. Direction "mowing stripes"
     (plans/lawn/PLAN.md section 5): diagonal green stripes, cream text, the seed-bag tag. The
     figure is the fertilizer calculator's default (24-0-6, 1.0 lb N, 5,000 sq ft: 20.8 lb, two
     15 lb bags). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Young Serif';
        font-weight: 400;
        src: url('../../../node_modules/@fontsource/young-serif/files/young-serif-latin-400-normal.woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 600;
        src: url('../../../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2');
      }
      body {
        margin: 0;
      }
      .og {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 72px 80px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #f6f1e4;
        font-family: 'Inter', sans-serif;
        background: repeating-linear-gradient(135deg, #2e6b34 0 70px, #367a3c 70px 140px);
      }
      h1 {
        margin: 0 0 24px;
        font-family: 'Young Serif', serif;
        font-weight: 400;
        font-size: 104px;
        line-height: 1;
      }
      p {
        margin: 0;
        max-width: 520px;
        font-size: 34px;
        font-weight: 600;
        line-height: 1.3;
      }
      .tag {
        position: relative;
        padding: 40px 48px 32px 84px;
        background: #f2d14b;
        color: #1d3b22;
        border-radius: 14px 40px 40px 14px;
        transform: rotate(-2.5deg);
        box-shadow: 0 16px 40px rgb(0 0 0 / 0.3);
      }
      .tag::before {
        content: '';
        position: absolute;
        left: 28px;
        top: 50%;
        width: 26px;
        height: 26px;
        margin-top: -13px;
        border-radius: 50%;
        background: #2e6b34;
      }
      .tag b {
        display: block;
        font-family: 'Young Serif', serif;
        font-weight: 400;
        font-size: 96px;
        line-height: 1;
      }
      .tag span {
        display: block;
        margin-top: 12px;
        font-size: 30px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div>
        <h1>Lawn Figures</h1>
        <p>Fertilizer, seed, sod and lime calculators, and frost dates by ZIP.</p>
      </div>
      <div class="tag"><b>20.8 lb</b><span>= 2 bags of 15 lb</span></div>
    </div>
  </body>
</html>
