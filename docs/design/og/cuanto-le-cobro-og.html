<!doctype html>
<!-- The link preview of Cuánto Le Cobro (WhatsApp, social): 1200x630, rendered to
     apps/cobro/public/og.png by tooling/site-browser/og/render-cobro.mjs. Direction "el presupuesto"
     (plans/cobro/PLAN.md): near-black ground, marigold brand mark, a paper receipt with a torn
     edge. The figures are the painting quote at its starting values (tests: apps/cobro/src/cases.ts). -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-weight: 800;
        src: url('../../../node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-800-normal.woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 400;
        src: url('../../../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 700;
        src: url('../../../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2');
      }
      body {
        margin: 0;
      }
      .og {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 90px;
        background: #121212;
        color: #f5f5f0;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font: 800 44px 'Bricolage Grotesque', sans-serif;
      }
      .brand i {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #ffc233;
      }
      h1 {
        margin: 36px 0 20px;
        max-width: 560px;
        font: 800 84px/1 'Bricolage Grotesque', sans-serif;
      }
      p {
        margin: 0;
        font-size: 30px;
        color: #b4b4aa;
      }
      .pill {
        display: inline-block;
        margin-top: 34px;
        padding: 14px 28px;
        border-radius: 14px;
        background: #3ddc84;
        color: #0b1f12;
        font-weight: 700;
        font-size: 28px;
      }
      .receipt {
        position: relative;
        width: 400px;
        padding: 34px 34px 28px;
        background: #fffdf6;
        color: #1a1a1a;
        transform: rotate(-3deg);
        box-shadow: 0 18px 50px rgb(0 0 0 / 0.55);
      }
      .receipt::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -18px;
        height: 18px;
        background:
          linear-gradient(135deg, #fffdf6 25%, transparent 25%) -14px 0,
          linear-gradient(225deg, #fffdf6 25%, transparent 25%) -14px 0;
        background-size: 28px 28px;
      }
      .receipt h2 {
        margin: 0 0 14px;
        font: 700 22px 'Inter', sans-serif;
        letter-spacing: 0.2em;
        color: #4a4a44;
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-top: 2px dashed #4a4a44;
        font-size: 26px;
        font-weight: 700;
      }
      .total {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 14px;
        font: 800 30px 'Bricolage Grotesque', sans-serif;
      }
      .total b {
        font-size: 72px;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div>
        <div class="brand"><i></i>Cuánto Le Cobro</div>
        <h1>Cuánto le cobro al cliente</h1>
        <p>Presupuestos para limpieza, pintura, drywall, concreto y jardín.</p>
        <span class="pill">Enviar presupuesto por WhatsApp</span>
      </div>
      <div class="receipt">
        <h2>PRESUPUESTO</h2>
        <div class="row"><span>Mano de obra</span><span>$200.00</span></div>
        <div class="row"><span>Pintura</span><span>$80.00</span></div>
        <div class="row"><span>Recargos</span><span>$74.20</span></div>
        <div class="total"><span>TOTAL</span><b>$354.20</b></div>
      </div>
    </div>
  </body>
</html>
