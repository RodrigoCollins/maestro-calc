schema: spec-driven

context: |
  Project: maestro-calc (Maestro Calc) - bilingual EN/ES US jobsite calculators. Source of truth: PLAN.md (Spanish).
  Target stack: Astro static + strict TypeScript, Cloudflare Pages, npm-workspaces monorepo (packages/core, data, i18n; apps/web).
  Current state: npm-workspaces monorepo (apps/web Astro app; packages/core, data, i18n as TypeScript-source packages); legacy src/lib prototype removed in the first change.
  Testing: vitest 5 projects (unit tests; type tests via typecheck.include) with V8 coverage thresholds; blocking format, lint and typecheck gates in CI. fast-check property tests and Stryker mutation testing on core (PR 3); planned: Playwright e2e, Lighthouse budgets, SEO checks in CI.
  Style: calc logic stays pure TS in core (no UI, no language); data and i18n separated; shareable state in URL; generated artifacts in English.

strict_tdd: true

testing:
  strict_tdd: true
  detected: 2026-10-22
  runner:
    command: "npm test"   # vitest run
    framework: vitest 5.0.x
  layers:
    unit: { available: true, tool: vitest }
    integration: { available: false, tool: null }
    e2e: { available: true, tool: playwright, command: "npm run test:e2e" }   # tooling/site-browser: axe + phone smoke against wrangler dev; needs npm ci --prefix tooling/site-browser and a built apps/web/dist
  coverage:
    available: true      # @vitest/coverage-v8; thresholds: core 100, data/i18n 90
    command: "npm run test:coverage"
  mutation:
    available: true      # Stryker 10 command runner over packages/core (vitest-runner incompatible with vitest 5)
    command: "npm run mutation"   # thresholds high 95 / low 90 / break 90, STRYKER=1 gives 50 property runs
  site_check:
    available: true
    command: "npm run check:site"   # built-HTML rules over apps/web/dist (after npm run build); 100 percent covered in apps/web/src/site-check
  quality:
    linter: { available: true, command: "npm run lint" }   # eslint, typescript-eslint strictTypeChecked, --max-warnings=0
    type_checker: { available: true, command: "npm run typecheck" }   # tsc --noEmit per package program (src purity gate + tests), astro check for web, root tooling files (JS configs are linted, not type-checked: checkJs is a tracked follow-up); "npm run check" is an alias
    formatter: { available: true, command: "npm run format:check" }   # prettier + prettier-plugin-astro

quality_bar:
  - Top-tier, tech-lead-approvable code.
  - TypeScript strict (no any, no unchecked non-null assertions in core).
  - Lint and format are blocking gates (local and CI).
  - Every formula has unit tests with hand-verified cases (inputs and expected values sourced in the test).
  - Coverage thresholds enforced in vitest config (core: 100% lines/branches/functions; other packages >= 90%).
  - Mutation testing (Stryker) on calculation code (packages/core, formula parts of packages/data) with a break threshold.
  - Each delivery gets 4 specialized reviewers plus Judgment Day.
  - Review budget 400 changed lines per PR (additions + deletions); delivery_strategy auto-chain (chain strategy stacked-to-main).

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference the PLAN.md section the change implements
    - Forecast changed lines against the 400-line review budget
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Every formula requirement lists source and at least one hand-verified example
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Respect the core/data/i18n/web separation (PLAN.md section 6.1)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Include the review-workload forecast guard lines; split into chained PRs when over 400 lines
  apply:
    tdd: true
    test_command: "npm test"
    guidelines:
      - RED-GREEN-REFACTOR; write the failing test with hand-verified values first
      - Strict TypeScript; no application code outside the agreed change scope
      - Conventional commits, no AI attribution
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    type_check_command: "npm run check"
    coverage_threshold: 100   # packages/core; others 90 (approved by Rodrigo 2026-10-22)
    mutation_command: "npm run mutation"
    review: "4 specialized reviewers + Judgment Day before archive"
  archive:
    - Warn before merging destructive deltas
