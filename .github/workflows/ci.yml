name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run sync
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # MW11b: the packages ship source, so a build must leave no `dist` behind.
      - run: npm run check:dist

  # One runner per Stryker shard (design 3.19b): the command runner reruns the shard's tests for
  # every mutant, so splitting `mutate` and the test command by module cuts the wall time.
  mutation:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Must equal `shards` in packages/core/stryker.config.mjs (ci.contract.test.ts enforces it);
        # `npm run mutation -- --list` prints the names.
        shard: [rational, units, format, calculator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # One key for restore and save. It is a superset of what the Stryker config hashes (core
      # sources and tests, package config, root test and compiler config, Node, lockfile), so an
      # exact hit is always sound. GitHub does not offer `runner` or `hashFiles` to a job-level env.
      - name: Compute the Stryker cache key
        run: >-
          echo "STRYKER_CACHE_KEY=stryker-${RUNNER_OS}-${{ matrix.shard }}-${{
          hashFiles('packages/core/src/**', 'packages/core/*.json',
          'packages/core/stryker.config.mjs', 'packages/core/vitest.config.ts',
          'vitest.config.ts', 'tsconfig.base.json', '.nvmrc', 'package-lock.json') }}"
          >> "$GITHUB_ENV"
      # Stryker reuses the report only when the key matches exactly (no restore-keys fallback). Each
      # shard has its own key and report, so shards never overwrite each other's cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/core/reports/stryker-incremental-*-${{ matrix.shard }}.json
          key: ${{ env.STRYKER_CACHE_KEY }}
      - run: npm run mutation -- --shard ${{ matrix.shard }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/core/reports/stryker-incremental-*-${{ matrix.shard }}.json
          key: ${{ env.STRYKER_CACHE_KEY }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.shard }}
          path: packages/core/reports/mutation
          if-no-files-found: ignore

  # The one stable required-check name, whatever the number of shards: branch protection requires
  # `mutation-gate`, not the `mutation (<shard>)` entries of the matrix, so adding a shard needs no
  # settings change. `always()` makes a failed, cancelled or skipped shard fail this job too.
  mutation-gate:
    needs: mutation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mutation shard to pass
        env:
          MUTATION_RESULT: ${{ needs.mutation.result }}
        run: test "$MUTATION_RESULT" = success
