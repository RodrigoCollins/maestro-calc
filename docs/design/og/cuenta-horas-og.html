<!doctype html>
<!-- The link preview of Cuenta Horas (WhatsApp, social): 1200x630, rendered to
     apps/pay/public/og.png by tooling/site-browser/og/render-pay.mjs. Figures are the time
     card's default week (49.5 h, $1,193.50 at $22 an hour). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo';
        font-weight: 800;
        src: url('../../../node_modules/@fontsource/archivo/files/archivo-latin-800-normal.woff2');
      }
      @font-face {
        font-family: 'Archivo';
        font-weight: 400;
        src: url('../../../node_modules/@fontsource/archivo/files/archivo-latin-400-normal.woff2');
      }
      @font-face {
        font-family: 'Plex Mono';
        font-weight: 600;
        src: url('../../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2');
      }
      body {
        margin: 0;
      }
      .og {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        background: #efe6cf;
        color: #1b1a17;
        font-family: 'Archivo', sans-serif;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 72px;
        border-top: 28px solid #1b1a17;
      }
      .copy {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-weight: 800;
        font-size: 40px;
      }
      h1 {
        margin: 0;
        font-size: 76px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .es {
        margin: 0;
        font-size: 36px;
        color: #3d382d;
      }
      .card {
        width: 400px;
        background: #fbf7ec;
        border: 4px solid #1b1a17;
        border-radius: 12px;
        padding: 26px;
        font-family: 'Plex Mono', monospace;
        font-size: 26px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        transform: rotate(2deg);
      }
      .row {
        display: flex;
        justify-content: space-between;
        border-top: 2px dashed #b9ae92;
        padding-top: 12px;
      }
      .head {
        font-family: 'Archivo', sans-serif;
        font-weight: 800;
        font-size: 28px;
        border: 0;
        padding: 0;
      }
      .stamp {
        font-family: 'Plex Mono', monospace;
        color: #8e2f07;
        border: 3px solid #8e2f07;
        border-radius: 4px;
        padding: 0 8px;
        font-size: 22px;
      }
      .total {
        border-top: 4px solid #1b1a17;
      }
      .total span:last-child {
        color: #1f6b45;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="copy">
        <div class="brand">
          <svg width="52" height="52" viewBox="0 0 26 26" fill="none" stroke="#1b1a17" stroke-width="1.8">
            <rect x="4" y="2" width="18" height="22" rx="2"></rect>
            <path d="M8 7h10M8 11h10M8 15h6"></path>
            <circle cx="18" cy="19" r="2.2" fill="#e0a23b" stroke="none"></circle>
          </svg>
          Cuenta Horas
        </div>
        <h1>What you work, counted right.</h1>
        <p class="es" lang="es">Lo que trabajas, bien contado.</p>
      </div>
      <div class="card">
        <div class="row head"><span>Time card</span><span class="stamp">49.5 H</span></div>
        <div class="row"><span>Mon 7:00a–4:30p</span><span>9</span></div>
        <div class="row"><span>Tue 7:00a–4:30p</span><span>9</span></div>
        <div class="row"><span>Wed 7:00a–4:30p</span><span>9</span></div>
        <div class="row total"><span>Gross</span><span>$1,193.50</span></div>
      </div>
    </div>
  </body>
</html>
