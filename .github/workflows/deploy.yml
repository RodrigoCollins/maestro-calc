name: Deploy

# After Cloudflare deploys a push to main: wait for its build, smoke the live site, notify IndexNow.
on:
  push:
    branches: [main]

permissions:
  contents: read
  checks: read

# No concurrency group: GitHub drops a pending run of a group, and the next run's compare would then
# miss that push's changes. Two notifications at once are harmless.

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A build that never starts (#133) or fails stops here, which is the alarm. Cloudflare builds
      # only the newest of several quick pushes, so an older push with no build is superseded.
      - id: build
        name: Wait for the Cloudflare build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 60); do
            run=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=Workers%20Builds:%20maestro-calc" \
              --jq '.check_runs[0] | select(. != null) | "\(.status) \(.conclusion)"') || run=''
            case "$run" in
              "completed success") echo "build: $run"; exit 0 ;;
              completed*) echo "build: $run"; exit 1 ;;
            esac
            head=$(gh api "repos/$REPO/commits/main" --jq .sha) || head=''
            if [ -z "$run" ] && [ -n "$head" ] && [ "$head" != "$SHA" ]; then
              echo "build: superseded by $head"; echo "superseded=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 20
          done
          echo "build: no completed Workers Builds check after 20 minutes"
          exit 1
      # A superseded push has no build of its own: the newer push's run smokes the site.
      - id: smoke
        name: Smoke the live site
        if: steps.build.outputs.superseded != 'true'
        run: node apps/web/scripts/production.ts smoke
      # Only a push that touches what the site is built from notifies; an openspec archive does not.
      - id: changed
        name: Find site changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename')
          site=$(printf '%s\n' "$files" | grep -E '^(apps/web|packages)/' \
            | grep -Ev '(\.test(-d)?\.ts$|/__testing__/)' || true)
          if [ -n "$site" ]; then echo "site=true" >> "$GITHUB_OUTPUT"; else echo "site=false" >> "$GITHUB_OUTPUT"; fi
      - id: indexnow
        name: Notify IndexNow
        if: steps.changed.outputs.site == 'true'
        run: node apps/web/scripts/production.ts indexnow

  # plans/growth/PLAN.md › G3: each niche site deploys from its own Workers Builds project; once that
  # build is green and the push touched the site, IndexNow hears every URL of its live sitemap.
  niche-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: pay
            worker: cuenta-horas
          - app: pool
            worker: pool-figures
          - app: lawn
            worker: lawn-figures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: build
        name: Wait for the Cloudflare build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 60); do
            run=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=Workers%20Builds:%20${{ matrix.worker }}" \
              --jq '.check_runs[0] | select(. != null) | "\(.status) \(.conclusion)"') || run=''
            case "$run" in
              "completed success") echo "build: $run"; exit 0 ;;
              completed*) echo "build: $run"; exit 1 ;;
            esac
            head=$(gh api "repos/$REPO/commits/main" --jq .sha) || head=''
            if [ -z "$run" ] && [ -n "$head" ] && [ "$head" != "$SHA" ]; then
              echo "build: superseded by $head"; echo "superseded=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 20
          done
          echo "build: no completed Workers Builds check after 20 minutes"
          exit 1
      - id: changed
        name: Find site changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename')
          site=$(printf '%s\n' "$files" | grep -E '^(apps/${{ matrix.app }}|packages)/' \
            | grep -Ev '(\.test(-d)?\.ts$|/__testing__/)' || true)
          if [ -n "$site" ]; then echo "site=true" >> "$GITHUB_OUTPUT"; else echo "site=false" >> "$GITHUB_OUTPUT"; fi
      - id: indexnow
        name: Notify IndexNow
        if: steps.changed.outputs.site == 'true'
        run: node apps/${{ matrix.app }}/scripts/indexnow.ts
