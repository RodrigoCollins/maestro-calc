<!doctype html>
<!-- The link preview of Pool Figures (WhatsApp, social): 1200x630, rendered to
     apps/pool/public/og.png by tooling/site-browser/og/render-pool.mjs. Direction v2.1 "depth
     marker" (plans/pool/PLAN.md): white tile grid, ink, the result as a depth-marker tile. The
     figure is the home sample, the volume calculator's default pool (22,023 gallons). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Barlow Condensed';
        font-weight: 700;
        src: url('../../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2');
      }
      @font-face {
        font-family: 'Barlow';
        font-weight: 400;
        src: url('../../../node_modules/@fontsource/barlow/files/barlow-latin-400-normal.woff2');
      }
      @font-face {
        font-family: 'Barlow';
        font-weight: 600;
        src: url('../../../node_modules/@fontsource/barlow/files/barlow-latin-600-normal.woff2');
      }
      body {
        margin: 0;
      }
      .og {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        color: #111111;
        font-family: 'Barlow', sans-serif;
        background-color: #fafaf7;
        background-image:
          linear-gradient(#e4e4dc 2px, transparent 2px),
          linear-gradient(90deg, #e4e4dc 2px, transparent 2px);
        background-size: 60px 60px;
        background-position: -1px -1px;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 96px;
        padding: 0 64px;
        background: #ffffff;
        border-bottom: 6px solid #111111;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 48px;
        text-transform: uppercase;
        letter-spacing: 0.01em;
      }
      .bar span {
        font-family: 'Barlow', sans-serif;
        font-weight: 600;
        font-size: 26px;
        text-transform: none;
        letter-spacing: 0.02em;
      }
      .body {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 64px;
      }
      .copy {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      h1 {
        margin: 0;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 112px;
        line-height: 0.92;
        text-transform: uppercase;
      }
      .copy p {
        margin: 0;
        max-width: 560px;
        font-size: 32px;
        line-height: 1.3;
      }
      .marker {
        display: flex;
        flex-direction: column;
        gap: 18px;
        flex: none;
        width: 420px;
        box-sizing: border-box;
        padding: 30px 34px;
        background: #ffffff;
        border: 6px solid #111111;
      }
      .figure {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 120px;
        line-height: 0.9;
        font-variant-numeric: tabular-nums;
      }
      .figure small {
        display: block;
        margin-top: 10px;
        font-size: 44px;
        letter-spacing: 0.08em;
      }
      .depths {
        display: flex;
        justify-content: space-between;
        padding-top: 16px;
        border-top: 3px solid #111111;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 34px;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="bar">Pool Figures <span>poolfigures.com</span></div>
      <div class="body">
        <div class="copy">
          <h1>Know your pool by the gallon.</h1>
          <p>Gallons, salt, chlorine and pump size. Every dose shows its math.</p>
        </div>
        <div class="marker">
          <div class="figure">22,023<small>GALLONS</small></div>
          <div class="depths"><span>3½ FT</span><span>32 × 16 FT</span><span>8 FT</span></div>
        </div>
      </div>
    </div>
  </body>
</html>
