<!doctype html>
<!-- The link preview of Bowl Figures (WhatsApp, social): 1200x630, rendered to
     apps/pets/public/og.png by tooling/site-browser/og/render-pets.mjs. Direction "the bowl"
     (plans/pets/PLAN.md section 5): oat ground, a plum block holding the top-view bowl and the
     huge figure. The figure is the home sample, the dog calculator's default (40 lb, 360 kcal cup). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-weight: 900;
        src: url('../../../node_modules/@fontsource/fraunces/files/fraunces-latin-900-normal.woff2');
      }
      @font-face {
        font-family: 'Fraunces';
        font-weight: 700;
        src: url('../../../node_modules/@fontsource/fraunces/files/fraunces-latin-700-normal.woff2');
      }
      @font-face {
        font-family: 'DM Sans';
        font-weight: 400;
        src: url('../../../node_modules/@fontsource/dm-sans/files/dm-sans-latin-400-normal.woff2');
      }
      @font-face {
        font-family: 'DM Sans';
        font-weight: 700;
        src: url('../../../node_modules/@fontsource/dm-sans/files/dm-sans-latin-700-normal.woff2');
      }
      body {
        margin: 0;
      }
      .og {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding: 48px 64px;
        gap: 32px;
        background: #fff4e0;
        color: #2a1f3d;
        font-family: 'DM Sans', sans-serif;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: 'Fraunces', serif;
        font-weight: 900;
        font-size: 44px;
      }
      .bar span {
        font-family: 'DM Sans', sans-serif;
        font-weight: 700;
        font-size: 26px;
      }
      .hero {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 56px;
        border-radius: 36px;
        background: #2a1f3d;
        color: #fff4e0;
      }
      .copy h1 {
        margin: 0;
        font-family: 'Fraunces', serif;
        font-weight: 900;
        font-size: 150px;
        line-height: 0.95;
      }
      .copy h1 small {
        display: block;
        font-family: 'DM Sans', sans-serif;
        font-weight: 700;
        font-size: 44px;
      }
      .copy p {
        margin: 20px 0 0;
        font-size: 30px;
        line-height: 1.3;
      }
      .chips {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }
      .chips span {
        padding: 8px 20px;
        border-radius: 999px;
        background: #fff4e0;
        color: #2a1f3d;
        font-weight: 700;
        font-size: 26px;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="bar">Bowl Figures <span>bowlfigures.com</span></div>
      <div class="hero">
        <svg viewBox="0 0 200 200" width="320" height="320">
          <circle cx="100" cy="100" r="96" fill="#ff7a59" />
          <circle cx="100" cy="100" r="76" fill="#fff4e0" />
          <path d="M100 28v144" stroke="#2a1f3d" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 6" />
          <g fill="#c98b4b">
            <circle cx="72" cy="80" r="6" /><circle cx="128" cy="120" r="6" /><circle cx="60" cy="116" r="6" />
            <circle cx="140" cy="76" r="6" /><circle cx="100" cy="150" r="6" /><circle cx="84" cy="52" r="6" />
          </g>
          <g fill="#e5a55d">
            <circle cx="112" cy="64" r="6" /><circle cx="76" cy="136" r="6" /><circle cx="130" cy="96" r="6" />
            <circle cx="68" cy="98" r="6" /><circle cx="108" cy="124" r="6" />
          </g>
          <g fill="#a56b34">
            <circle cx="92" cy="96" r="6" /><circle cx="120" cy="140" r="6" /><circle cx="148" cy="108" r="6" />
            <circle cx="90" cy="70" r="6" />
          </g>
        </svg>
        <div class="copy">
          <h1>2 ¾<small>cups a day</small></h1>
          <p>A 40 lb dog on a 360 kcal cup. Every figure shows its math.</p>
          <div class="chips"><span>985 kcal</span><span>treats ≤ 98</span></div>
        </div>
      </div>
    </div>
  </body>
</html>
