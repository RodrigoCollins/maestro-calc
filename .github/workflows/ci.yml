name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run sync
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # QGW5: the built HTML is checked right after the build, before the dist guard.
      - run: npm run check:site
      # MW11b: the packages ship source, so a build must leave no `dist` behind.
      - run: npm run check:dist
      # The site-browser job serves this exact build instead of rebuilding it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  # One runner per Stryker shard (design 3.19b): the command runner reruns the shard's tests for
  # every mutant, so splitting `mutate` and the test command by module cuts the wall time.
  mutation:
    # Without a name GitHub would list every matrix value, `inputs` included.
    name: mutation (${{ matrix.shard }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Must list the `shards` of packages/core/stryker.config.mjs followed by `data`, the one
        # shard of packages/data/stryker.config.mjs (ci.contract.test.ts enforces it);
        # `npm run mutation -- --list` prints the names. `inputs` are the globs of the files that
        # name the shard's report (the package's `identityFilesFor` minus the root files that
        # every entry shares, which the key step lists): one calculator pull request changes the
        # key of the `calculators` shard only. mutation-identity.contract.test.ts pins them.
        include:
          - shard: rational
            inputs: |
              packages/core/src/*.ts
              packages/core/src/calculator/**
              packages/core/src/format/**
              packages/core/src/money/**
              packages/core/src/rational/**
              packages/core/src/units/**
              packages/core/src/url/**
              packages/core/src/__testing__/arbitraries.ts
              packages/core/src/__testing__/collect-strings.ts
              packages/core/src/__testing__/fixture-box.ts
              packages/core/src/__testing__/language-free.ts
              packages/core/src/__testing__/length-failure.ts
              packages/core/src/__testing__/message-key-fixtures.ts
              packages/core/src/__testing__/property-runs.ts
              packages/core/src/__testing__/thrown-code.ts
              packages/core/*.json
              packages/core/stryker.config.mjs
              packages/core/vitest.config.ts
          - shard: units
            inputs: |
              packages/core/src/*.ts
              packages/core/src/calculator/**
              packages/core/src/format/**
              packages/core/src/money/**
              packages/core/src/rational/**
              packages/core/src/units/**
              packages/core/src/url/**
              packages/core/src/__testing__/arbitraries.ts
              packages/core/src/__testing__/collect-strings.ts
              packages/core/src/__testing__/fixture-box.ts
              packages/core/src/__testing__/language-free.ts
              packages/core/src/__testing__/length-failure.ts
              packages/core/src/__testing__/message-key-fixtures.ts
              packages/core/src/__testing__/property-runs.ts
              packages/core/src/__testing__/thrown-code.ts
              packages/core/*.json
              packages/core/stryker.config.mjs
              packages/core/vitest.config.ts
          - shard: format
            inputs: |
              packages/core/src/*.ts
              packages/core/src/calculator/**
              packages/core/src/format/**
              packages/core/src/money/**
              packages/core/src/rational/**
              packages/core/src/units/**
              packages/core/src/url/**
              packages/core/src/__testing__/arbitraries.ts
              packages/core/src/__testing__/collect-strings.ts
              packages/core/src/__testing__/fixture-box.ts
              packages/core/src/__testing__/language-free.ts
              packages/core/src/__testing__/length-failure.ts
              packages/core/src/__testing__/message-key-fixtures.ts
              packages/core/src/__testing__/property-runs.ts
              packages/core/src/__testing__/thrown-code.ts
              packages/core/*.json
              packages/core/stryker.config.mjs
              packages/core/vitest.config.ts
          - shard: calculator-define
            inputs: |
              packages/core/src/*.ts
              packages/core/src/calculator/**
              packages/core/src/format/**
              packages/core/src/money/**
              packages/core/src/rational/**
              packages/core/src/units/**
              packages/core/src/url/**
              packages/core/src/__testing__/arbitraries.ts
              packages/core/src/__testing__/collect-strings.ts
              packages/core/src/__testing__/fixture-box.ts
              packages/core/src/__testing__/language-free.ts
              packages/core/src/__testing__/length-failure.ts
              packages/core/src/__testing__/message-key-fixtures.ts
              packages/core/src/__testing__/property-runs.ts
              packages/core/src/__testing__/thrown-code.ts
              packages/core/src/__testing__/fixture-box.test.ts
              packages/core/*.json
              packages/core/stryker.config.mjs
              packages/core/vitest.config.ts
          - shard: calculator-run
            inputs: |
              packages/core/src/*.ts
              packages/core/src/calculator/**
              packages/core/src/format/**
              packages/core/src/money/**
              packages/core/src/rational/**
              packages/core/src/units/**
              packages/core/src/url/**
              packages/core/src/__testing__/arbitraries.ts
              packages/core/src/__testing__/collect-strings.ts
              packages/core/src/__testing__/fixture-box.ts
              packages/core/src/__testing__/language-free.ts
              packages/core/src/__testing__/length-failure.ts
              packages/core/src/__testing__/message-key-fixtures.ts
              packages/core/src/__testing__/property-runs.ts
              packages/core/src/__testing__/thrown-code.ts
              packages/core/*.json
              packages/core/stryker.config.mjs
              packages/core/vitest.config.ts
          - shard: url
            inputs: |
              packages/core/src/*.ts
              packages/core/src/calculator/**
              packages/core/src/format/**
              packages/core/src/money/**
              packages/core/src/rational/**
              packages/core/src/units/**
              packages/core/src/__testing__/arbitraries.ts
              packages/core/src/__testing__/collect-strings.ts
              packages/core/src/__testing__/fixture-box.ts
              packages/core/src/__testing__/language-free.ts
              packages/core/src/__testing__/length-failure.ts
              packages/core/src/__testing__/message-key-fixtures.ts
              packages/core/src/__testing__/property-runs.ts
              packages/core/src/__testing__/thrown-code.ts
              packages/core/*.json
              packages/core/stryker.config.mjs
              packages/core/vitest.config.ts
              packages/core/src/url/**
          - shard: calculators
            inputs: |
              packages/core/src/*.ts
              packages/core/src/calculator/**
              packages/core/src/format/**
              packages/core/src/money/**
              packages/core/src/rational/**
              packages/core/src/units/**
              packages/core/src/__testing__/arbitraries.ts
              packages/core/src/__testing__/collect-strings.ts
              packages/core/src/__testing__/fixture-box.ts
              packages/core/src/__testing__/language-free.ts
              packages/core/src/__testing__/length-failure.ts
              packages/core/src/__testing__/message-key-fixtures.ts
              packages/core/src/__testing__/property-runs.ts
              packages/core/src/__testing__/thrown-code.ts
              packages/core/*.json
              packages/core/stryker.config.mjs
              packages/core/vitest.config.ts
              packages/core/src/url/**
              packages/core/src/__testing__/released-snapshot.ts
              packages/core/src/calculators/**
          - shard: data
            inputs: |
              packages/data/src/**
              packages/core/*.json
              packages/core/src/*.ts
              packages/core/src/calculator/**
              packages/core/src/format/**
              packages/core/src/money/**
              packages/core/src/rational/**
              packages/core/src/units/**
              packages/core/src/url/**
              packages/data/*.json
              packages/data/stryker.config.mjs
              packages/data/vitest.config.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # One key for restore and save, per shard. It hashes the shard's own inputs (`matrix.inputs`)
      # and the root files every shard shares (Node, lockfile, compiler and test config, the shared
      # Stryker module), a superset of what the Stryker config hashes for that shard, so an exact
      # hit is always sound. GitHub does not offer `runner` or `hashFiles` to a job-level env.
      - name: Compute the Stryker cache key
        run: >-
          echo "STRYKER_CACHE_KEY=stryker-${RUNNER_OS}-${{ matrix.shard }}-${{
          hashFiles(matrix.inputs, 'vitest.config.ts', 'tooling/stryker.mjs',
          'tsconfig.base.json', '.nvmrc', 'package-lock.json') }}"
          >> "$GITHUB_ENV"
      # Stryker reuses the report only when the key matches exactly (no restore-keys fallback). Each
      # shard has its own key and report, so shards never overwrite each other's cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/reports/stryker-incremental-*-${{ matrix.shard }}.json
          key: ${{ env.STRYKER_CACHE_KEY }}
      - run: npm run mutation -- --shard ${{ matrix.shard }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/reports/stryker-incremental-*-${{ matrix.shard }}.json
          key: ${{ env.STRYKER_CACHE_KEY }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.shard }}
          path: packages/*/reports/mutation
          if-no-files-found: ignore

  # The one stable required-check name, whatever the number of shards: branch protection requires
  # `mutation-gate`, not the `mutation (<shard>)` entries of the matrix, so adding a shard needs no
  # settings change. `always()` makes a failed, cancelled or skipped shard fail this job too.
  mutation-gate:
    needs: mutation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mutation shard to pass
        env:
          MUTATION_RESULT: ${{ needs.mutation.result }}
        run: test "$MUTATION_RESULT" = success

  # Browser gate (axe and phone smoke) against `wrangler dev`, which applies the same asset rules and
  # headers as production. Runs beside the mutation matrix; never path-filtered, so its required
  # check cannot stay pending.
  site-browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tooling/site-browser/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - run: npm ci --prefix tooling/site-browser
      - run: npm run typecheck --prefix tooling/site-browser
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tooling/site-browser/package-lock.json') }}
      - run: npx --prefix tooling/site-browser playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: tooling/site-browser/playwright-report
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-test-results
          path: tooling/site-browser/test-results
          if-no-files-found: ignore
